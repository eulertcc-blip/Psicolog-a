<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f6b5e">
  <meta name="description" content="Aplicación de Psicología">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="https://i.imgur.com/D6QyJty.png">
  <link rel="apple-touch-icon" href="https://i.imgur.com/D6QyJty.png">
  <title>Psicología</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; background:#f3f2ed; }
    body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; overflow:hidden; }
    #app { width:100%; height:100%; border:0; display:block; }
    #loading {
      position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:14px; background:#f3f2ed;
      color:#3f6b5e; transition:opacity .25s ease;
    }
    #loading img { width:96px; height:96px; object-fit:contain; border-radius:22px; }
    #loading strong { font-size:22px; }
    #loading small { color:#666; }
    #error {
      display:none; position:fixed; inset:0; z-index:20; padding:30px;
      background:#f3f2ed; color:#222; text-align:center;
    }
    #error a {
      display:inline-block; margin-top:18px; padding:12px 18px; border-radius:10px;
      background:#3f6b5e; color:#fff; text-decoration:none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="https://i.imgur.com/D6QyJty.png" alt="Psicología">
    <strong>Psicología</strong>
    <small>Abriendo aplicación…</small>
  </div>

  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbyZJiMOOIgckXdffYCDjJ_nforip7JHNQNBa9y-YjHi7yQ7x1AGiOhudkHCYrRWLtgPLw/exec"
    title="Psicología"
    allow="microphone; camera; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <div id="error">
    <h2>No se pudo cargar la aplicación</h2>
    <p>Comprueba tu conexión a Internet e intenta nuevamente.</p>
    <a href="https://script.google.com/macros/s/AKfycbyZJiMOOIgckXdffYCDjJ_nforip7JHNQNBa9y-YjHi7yQ7x1AGiOhudkHCYrRWLtgPLw/exec" target="_blank" rel="noopener">Abrir Psicología</a>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
    const iframe = document.getElementById('app');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');

    setTimeout(() => {
      loading.style.opacity = '0';
      setTimeout(() => loading.style.display = 'none', 260);
    }, 1800);

    setTimeout(() => {
      if (!iframe.contentWindow) {
        loading.style.display = 'none';
        error.style.display = 'block';
      }
    }, 8000);
  </script>
</body>
</html>
